name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.10", "3.12"]

    env:
      MPLBACKEND: Agg
      WANDB_MODE: disabled

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/lock.txt

      - name: Create runtime caches
        shell: bash
        run: |
          echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib" >> "$GITHUB_ENV"
          echo "NUMBA_CACHE_DIR=$RUNNER_TEMP/numba-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/matplotlib" "$RUNNER_TEMP/numba-cache"

      - name: Install locked dependencies
        run: python -m pip install --constraint requirements/lock.txt -e ".[test,topspin]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run portable test suite
        # The deterministic report/schema part of the synthetic end-to-end
        # test remains gating on every platform.  Only the declared ten-seed
        # accuracy distribution is opt-in and characterized below.
        run: python -m pytest -q

  synthetic-topspin-diagnostic:
    name: macOS synthetic TOPSPIN diagnostic
    runs-on: macos-15
    continue-on-error: true
    env:
      MPLBACKEND: Agg
      ESPINSLAM_RUN_SEED_DIAGNOSTIC: "1"
      WANDB_MODE: disabled

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lock.txt

      - name: Create runtime caches
        shell: bash
        run: |
          echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib" >> "$GITHUB_ENV"
          echo "NUMBA_CACHE_DIR=$RUNNER_TEMP/numba-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/matplotlib" "$RUNNER_TEMP/numba-cache"

      - name: Install locked dependencies
        run: python -m pip install --constraint requirements/lock.txt -e ".[test,topspin]"

      - name: Run known stochastic end-to-end diagnostic
        run: >-
          python -m pytest -vv
          tests/test_pipeline.py::test_topspin_accuracy_declared_seed_distribution

  gtsam-equivalence:
    name: Linux / Python 3.10 / GTSAM 4.2 equivalence
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install isolated GTSAM audit environment
        # GTSAM 4.2's wheel requires NumPy <2, while the portable lock uses
        # NumPy 2.  Install only the equivalence test's audited dependencies in
        # this separate job; do not mix this environment with the runtime lock.
        run: |
          python -m pip install "numpy==1.26.4" "scipy==1.15.3" "numba==0.68.1" "pytest==9.2.0" "gtsam==4.2"
          python -m pip install --no-deps -e .

      - name: Run frozen direct-GTSAM equivalence gate
        run: python -m pytest -q tests/test_gtsam_equivalence.py
