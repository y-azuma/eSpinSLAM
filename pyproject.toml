[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "espinslam"
version = "0.1.0"
description = "Independent eSpinSLAM reproduction for spinning-object event streams"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "opencv-python-headless>=4.8",
  "scikit-learn>=1.4",
  "matplotlib>=3.7",
  "wandb>=0.17",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["espinslam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

